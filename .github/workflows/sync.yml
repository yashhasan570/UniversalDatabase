name: Sync
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync from upstream (fresh tree)
        run: |
          git clone --depth 1 https://github.com/nocodb/nocodb.git /tmp/upstream
          cp -a .github /tmp/keep.github
          cp -a scripts /tmp/keep.scripts
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          rsync -a /tmp/upstream/ ./
          rm -rf /tmp/upstream .github scripts
          cp -a /tmp/keep.github .github
          cp -a /tmp/keep.scripts scripts
      - name: Re-apply rebrand
        run: python3 scripts/migrate.py
      - name: Commit and push
        run: |
          git config user.name "yashhasan570"
          git config user.email "hasankhalid700570@gmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: sync upstream"
          git push
