name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "ver=$(node -p "require('./packages/universaldatabase/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/yashhasan570/universaldatabase:latest
            ghcr.io/yashhasan570/universaldatabase:${{ steps.ver.outputs.ver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  release:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "ver=$(node -p "require('./packages/universaldatabase/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create release with image instructions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(cat <<'NOTES'
          Self-hosted Airtable alternative: databases as smart spreadsheets.

          ## Run

          ```
          docker pull ghcr.io/yashhasan570/universaldatabase:latest
          docker run -d --name universaldatabase -p 8080:8080 \
            -v universaldatabase_data:/usr/src/app/data \
            ghcr.io/yashhasan570/universaldatabase:latest
          ```

          Then open http://localhost:8080. For an external database pass
          NC_DB as a connection string; the image ships SQLite by default
          (SQLite zero-config).

          Image version: ${{ steps.ver.outputs.ver }} (linux/amd64).
          NOTES
          )
          gh release create latest --repo "$GITHUB_REPOSITORY" \
            --title "Universal Database ${{ steps.ver.outputs.ver }}" \
            --notes "$notes" --latest 2>/dev/null \
            || gh release edit latest --repo "$GITHUB_REPOSITORY" \
            --title "Universal Database ${{ steps.ver.outputs.ver }}" \
            --notes "$notes"
      - name: Make the image public (best effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH /users/yashhasan570/packages/container/universaldatabase \
            -f visibility=public 2>/dev/null || echo "package visibility left as-is"
