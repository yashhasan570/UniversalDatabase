services:

  universaldatabase:
    image: universaldatabase/universaldatabase:latest
    env_file: docker.env
    deploy:
      mode: replicated
      replicas: 1
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - universaldatabase_data:/usr/app/data
      - ./universaldatabase/db.json:/usr/app/data/db.json
    networks:
      - universaldatabase-network
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --tries=1 --spider http://localhost:8080/api/v1/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - '8080:8080'

  worker:
    image: universaldatabase/universaldatabase:latest
    env_file: docker.env
    environment:
      NC_WORKER_CONTAINER: 'true'
    depends_on:
      universaldatabase:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - universaldatabase_data:/usr/app/data
      - ./universaldatabase/db.json:/usr/app/data/db.json
    networks:
      - universaldatabase-network

  db:
    image: postgres:17.10
    environment:
      POSTGRES_USER: universaldatabase
      POSTGRES_PASSWORD: __PASSWORD__
      POSTGRES_DB: universaldatabase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U universaldatabase -d universaldatabase']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - universaldatabase-network

networks:
  universaldatabase-network:
    driver: bridge

volumes:
  universaldatabase_data:
  postgres_data:
