services:

  universaldatabase:
    image: universaldatabase/universaldatabase:latest
    env_file: docker.env
    deploy:
      mode: replicated
      replicas: 1
    restart: unless-stopped
    volumes:
      - universaldatabase_data:/usr/app/data
      - ./universaldatabase/db.json:/usr/app/data/db.json
    networks:
      - universaldatabase-network
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --tries=1 --spider http://localhost:8080/api/v1/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: universaldatabase/universaldatabase:latest
    env_file: docker.env
    environment:
      NC_WORKER_CONTAINER: 'true'
    depends_on:
      universaldatabase:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - universaldatabase_data:/usr/app/data
      - ./universaldatabase/db.json:/usr/app/data/db.json
    networks:
      - universaldatabase-network

networks:
  universaldatabase-network:
    driver: bridge

volumes:
  universaldatabase_data:
